name: OurSign

options:
  bundleIdPrefix: com.anar
  deploymentTarget:
    iOS: "26.0"

targets:
  OurSign:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - OurSignApp.swift
      - ContentView.swift
      - BrowseView.swift
      - AppsView.swift
      - SourcesView.swift
      - SettingsView.swift
      - AppItem.swift
      - AppCard.swift
      - LiquidGlass.metal
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.anar.oursign
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_KEY_CFBundleDisplayName: OurSign
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "0.0.1"
