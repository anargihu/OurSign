name: Build OurSign

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build OurSign
        run: |
          xcodebuild \
            -project OurSign.xcodeproj \
            -scheme OurSign \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          rm -rf Payload OurSign-0.0.1.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OurSign.app Payload/OurSign.app
          zip -r OurSign-0.0.1.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OurSign-0.0.1
          path: OurSign-0.0.1.ipa

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete Test --yes || true
          git push origin :refs/tags/Test || true
          gh release create Test OurSign-0.0.1.ipa \
            --title "OurSign 0.0.1" \
            --notes "OurSign 0.0.1 test build"