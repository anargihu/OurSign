name: OurSign

options:
  bundleIdPrefix: com.anar
  deploymentTarget:
    iOS: "26.0"

targets:
  OurSign:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - OurSignApp.swift
      - ContentView.swift
      - BrowseView.swift
      - AppsView.swift
      - SourcesView.swift
      - SettingsView.swift
      - AppItem.swift
      - AppCard.swift
      - LiquidGlass.metal
    info:
      path: OurSign/Info.plist
      properties:
        CFBundleDisplayName: OurSign
        CFBundleIdentifier: com.anar.oursign
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.anar.oursign
      SWIFT_VERSION: "5.0"
